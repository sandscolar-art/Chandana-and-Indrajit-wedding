<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chandana and Indrajit Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Noto+Serif+Bengali:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF3EE; --ink:#3A0F24; --soft:#7A5566; --gold:#B8741A; --rose:#C23A62; --line:#E7CFC6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#150F2B; --ink:#FBEFE3; --soft:#B7A9C9; --gold:#F2B134; --rose:#F0709A; --line:#3A2F5E; }
}
:root[data-theme="dark"]{ --bg:#150F2B; --ink:#FBEFE3; --soft:#B7A9C9; --gold:#F2B134; --rose:#F0709A; --line:#3A2F5E; }
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Fraunces","Noto Serif Bengali","Noto Serif Devanagari",Georgia,serif;display:flex;align-items:center;justify-content:center;text-align:center;overflow-x:hidden}
.screen{width:100%;max-width:560px;padding:24px 22px;display:flex;flex-direction:column;align-items:center;gap:26px}
.screen[hidden]{display:none}
.names{font-size:clamp(1.1rem,4.5vw,1.4rem);color:var(--soft);font-style:italic;letter-spacing:.02em}
.hello{height:clamp(4.2rem,17vw,6.4rem);display:flex;align-items:center;justify-content:center;font-size:clamp(3rem,15vw,5.4rem);font-weight:600;line-height:1;color:var(--gold);white-space:nowrap}
.hello .g,.names .g{display:inline-block;white-space:pre}
.in .g{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.out .g{animation:fall .55s ease-in both;animation-delay:calc(var(--i)*25ms)}
@keyframes rise{from{opacity:0;transform:translateY(55%) rotate(6deg);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fall{to{opacity:0;transform:translateY(-60%) rotate(-6deg);filter:blur(10px)}}
.rule{width:min(240px,60%);height:2px;background:linear-gradient(90deg,transparent,var(--rose),transparent);transform-origin:center;animation:draw 1.4s .4s ease-out both}
@keyframes draw{from{transform:scaleX(0)}}
.prompt{font-size:1.15rem}
.prompt small{display:block;margin-top:6px;color:var(--soft);font-size:.95rem}
.langs{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.lang{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:14px 22px;font-size:1.35rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .2s,border-color .2s,transform .15s}
.lang span{font-size:.85rem;color:var(--soft)}
.lang:hover{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 10%,transparent)}
.lang:active{transform:scale(.98)}
.lang:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.msg{font-size:clamp(2rem,9vw,3rem);font-weight:600;color:var(--gold);line-height:1.25}
.sub{color:var(--soft);font-size:1.1rem}
.back{font:inherit;background:none;border:none;color:var(--rose);font-size:1rem;cursor:pointer;text-decoration:underline;padding:8px}
.side{justify-content:center}
.nameform{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.nameform input{font:inherit;font-size:1.25rem;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:14px 22px;text-align:center;width:100%}
.nameform input::placeholder{color:var(--soft);opacity:.7}
.nameform input:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-color:var(--rose)}
.nameform .lang{background:var(--rose);border-color:var(--rose);color:#fff}
.err{color:var(--rose);min-height:1.5em;font-size:1.05rem}
.photo{width:min(72vw,280px,calc((100svh - 270px)*9/16));aspect-ratio:9/16;border:2px solid var(--line);border-radius:24px;overflow:hidden;background:var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.nextbtn{max-width:340px;width:100%}
.warn{color:#E0222B;font-weight:600;font-size:1.4rem;min-height:1.7em;line-height:1.3}
.lang.bad{border-color:#E0222B;color:#E0222B;background:rgba(224,34,43,.12)}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.fade{animation:fadein .7s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.in .g,.out .g,.rule,.fade{animation:none!important}}
</style>
</head>
<body>

<main class="screen" id="home">
  <div class="hello" id="hello" aria-live="polite"></div>
  <div class="rule"></div>
  <p class="prompt">Select a language<small>ভাষা বেছে নিন &nbsp; भाषा चुनें</small></p>
  <div class="langs">
    <button class="lang" data-l="bn" lang="bn">বাংলা <span>Bengali</span></button>
    <button class="lang" data-l="en" lang="en">English <span>English</span></button>
    <button class="lang" data-l="hi" lang="hi">हिन्दी <span>Hindi</span></button>
  </div>
</main>

<main class="screen" id="inv" hidden>
  <div class="msg fade" id="iq"></div>
  <div class="langs fade">
    <button class="lang side" id="yes"></button>
    <button class="lang side" id="no"></button>
  </div>
  <button class="back fade" id="iback"></button>
</main>

<main class="screen" id="nope" hidden>
  <div class="msg fade" id="nmsg"></div>
  <button class="back fade" id="nback"></button>
</main>

<main class="screen" id="next" hidden>
  <div class="msg fade" id="msg"></div>
  <div class="langs fade">
    <button class="lang side" id="sGirl"></button>
    <button class="lang side" id="sBoy"></button>
  </div>
  <button class="back fade" id="back"></button>
</main>

<main class="screen" id="nm" hidden>
  <div class="msg fade" id="nq"></div>
  <form class="nameform fade" id="nf" autocomplete="off" novalidate>
    <input id="ni" type="text" autocapitalize="words" spellcheck="false">
    <button class="lang side" type="submit" id="ngo"></button>
  </form>
  <p class="err" id="nerr" role="alert"></p>
  <button class="back fade" id="nback2"></button>
</main>

<main class="screen" id="done" hidden>
  <div class="photo fade" id="photo" role="img"></div>
  <button class="lang side nextbtn fade" id="dnext"></button>
  <button class="back fade" id="dback"></button>
</main>

<main class="screen" id="hq1" hidden>
  <div class="msg fade" id="h1q"></div>
  <form class="nameform fade" id="h1f" autocomplete="off" novalidate>
    <input id="h1i" type="text" spellcheck="false" autocapitalize="words">
    <button class="lang side" type="submit" id="h1go"></button>
  </form>
  <p class="sub fade" id="h1hint"></p>
  <p class="err" id="h1err" role="alert"></p>
  <button class="back fade" id="h1back"></button>
</main>

<main class="screen" id="hq2" hidden>
  <div class="msg fade" id="h2q"></div>
  <form class="nameform fade" id="h2f" autocomplete="off" novalidate>
    <input id="h2i" type="text" spellcheck="false" autocapitalize="words">
    <button class="lang side" type="submit" id="h2go"></button>
  </form>
  <p class="sub fade" id="h2hint"></p>
  <p class="err" id="h2err" role="alert"></p>
  <button class="back fade" id="h2back"></button>
</main>

<main class="screen" id="enj" hidden>
  <div class="msg fade" id="eq"></div>
  <div class="langs fade">
    <button class="lang side" id="eyes"></button>
    <button class="lang side" id="eno"></button>
  </div>
  <p class="warn" id="ewarn" role="alert"></p>
  <button class="back fade" id="eback"></button>
</main>

<main class="screen" id="soon" hidden>
  <div class="msg fade" id="smsg"></div>
  <p class="sub fade" id="scredit"></p>
  <button class="back fade" id="sback"></button>
</main>

  };
  function sk(t){
    t=t.toLowerCase().replace(/[^a-z]/g,"");
    t=t.replace(/chh|cch|ch|sh|z/g,"s").replace(/kh/g,"k").replace(/gh/g,"g").replace(/th/g,"t").replace(/dh/g,"d").replace(/ph/g,"p").replace(/bh/g,"b").replace(/jh/g,"j");
    t=t.replace(/[cqx]/g,"k").replace(/d/g,"r").replace(/[vw]/g,"b").replace(/y/g,"j").replace(/f/g,"p").replace(/[aeiouh]/g,"");
    return t.replace(/(.)\1+/g,"$1");
  }
  function plain(t){return t.toLowerCase().replace(/[\s.,\-]/g,"")}
  var town={
    h1:{skel:"klgs",alt:["কালাগাছ","কলাগাছ","কালাগাছ্","कालागाछ","कलागाछ"]},
    h2:{skel:"slgr",alt:["শিলিগুড়ি","শিলিগুরি","सिलीगुड़ी","सिलिगुड़ी","सिलीगुरी","शिलीगुड़ी"]}
  };
  function okTown(k,v){
    var p=plain(v);if(!p)return false;
    if(town[k].alt.some(function(a){return plain(a)===p}))return true;
    return sk(v)===town[k].skel;
  }
